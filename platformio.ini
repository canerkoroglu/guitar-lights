; Guitar Reactive RGB LED System — ESP32-WROOM-32 (ESP32 DevKit)
; See readme.md "Board Selection / Compatibility". The ESP8266 NodeMCU is NOT used.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Wi-Fi + web server + FastLED outgrow the default 1.25 MB app slot.
; huge_app = single 3 MB app partition (no OTA yet; revisit when OTA is added).
board_build.partitions = huge_app.csv

; Serial monitor / Serial Plotter baud (matches readme.md)
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; USB-UART bridge detected on this Mac. Change if the port moves.
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001

; FastLED pinned: 3.10.x does not detect the ESP32 RMT driver on Arduino-ESP32
; core 2.0.x and falls back to a blocking bit-bang driver (flicker with Wi-Fi on).
lib_deps =
    fastled/FastLED@3.7.8
    bblanchon/ArduinoJson@^7.0.0

; Unit tests run on the host, not the board.
test_ignore = *

; Host unit tests for lib/dsp (plain C++):  pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall
